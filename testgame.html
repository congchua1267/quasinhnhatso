<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title> Tính nhẩm với Úm ba la 🎄</title>
<meta name="description" content="Trò chơi tính nhẩm Giáng sinh 5 giây. Càng đúng nhiều, phép tính càng khó!">
<meta property="og:title" content="Tính nhẩm Giáng sinh 🎄">
<meta property="og:description" content="Thử thách tính nhẩm trong 5 giây cùng ông già Noel!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  color-scheme:dark;
  --bg:#0f2a22; --panel:#16392d; --ink:#fdf6e3; --muted:#a9c4b8; --line:#2c5a4a;
  --accent:#d7263d; --accent-ink:#ffffff; --gold:#f4c542;
  --good:#3fbf74; --bad:#ff5d6c; --flake:rgba(255,255,255,.85);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#e6f0ee; --panel:#ffffff; --ink:#12332a; --muted:#5d7a70; --line:#c3d6d0;
    --accent:#b3202f; --gold:#c48a00; --good:#1f8a4c; --bad:#c0392b; --flake:rgba(90,130,150,.55);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#e6f0ee; --panel:#ffffff; --ink:#12332a; --muted:#5d7a70; --line:#c3d6d0;
  --accent:#b3202f; --gold:#c48a00; --good:#1f8a4c; --bad:#c0392b; --flake:rgba(90,130,150,.55);
}
html,body{height:100%;min-height:100dvh;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
  user-select:none;-webkit-user-select:none;
}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;width:min(520px,100%);padding:20px;box-sizing:border-box}
.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.2)}
h1{margin:0 0 8px;font-size:2rem;font-weight:800;letter-spacing:-.02em}
p{margin:0 0 20px;color:var(--muted);line-height:1.5}
.go{width:100%;padding:16px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:1.1rem;font-weight:800;cursor:pointer;touch-action:manipulation}
.go:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none}
.lights{display:flex;justify-content:center;gap:14px;margin:0 0 6px}
.lights i{width:26px;height:34px;border-radius:50% 50% 55% 55%;background:var(--c);box-shadow:0 0 14px 2px var(--c);opacity:1}
.stats{display:flex;justify-content:space-between;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:10px}
.stats b{color:var(--ink)}
.q{font-size:clamp(2.6rem,12vw,3.8rem);font-weight:800;margin:22px 0;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts button{position:relative;padding:20px 8px;border:2px solid var(--line);border-radius:16px;background:transparent;color:var(--ink);font:inherit;font-size:1.8rem;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums;touch-action:manipulation}
.opts button small{position:absolute;top:6px;left:10px;font-size:.7rem;font-weight:600;color:var(--muted)}
@media (hover:hover){.opts button:hover{border-color:var(--gold)}}
.opts button:active{transform:scale(.97)}
.opts button.good{background:var(--good);border-color:var(--good);color:#fff}
.opts button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{min-height:1.6em;margin:14px 0 0;font-weight:600;color:var(--muted)}
.big{font-size:4.5rem;font-weight:800;line-height:1;margin:10px 0 4px;color:var(--gold);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main>
  <section class="card" id="start">
    <h1>Tính nhẩm Giáng sinh 🎄</h1>
    <p>Chọn đúng đáp án trong 5 giây. Chọn sai hoặc hết giờ là thua. Càng đúng nhiều, phép tính càng khó.</p>
    <button class="go" id="play" type="button">Bắt đầu 🎅</button>
    <p id="best" style="margin:16px 0 0"></p>
  </section>

  <section class="card hidden" id="game">
    <div class="lights" id="lights" aria-hidden="true">
      <i style="--c:#ff4d5e"></i><i style="--c:#f4c542"></i><i style="--c:#3fd47f"></i><i style="--c:#4aa8ff"></i><i style="--c:#ff7ad9"></i>
    </div>
    <div class="stats"><span>Đúng: <b id="sc">0</b></span><span>Còn: <b id="tm">5.0</b>s</span></div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
  </section>

  <section class="card hidden" id="end">
    <h1>Hết quà rồi! 🎁</h1>
    <p id="why" style="margin-bottom:6px"></p>
    <div class="big" id="fs">0</div>
    <p style="margin-bottom:4px">câu trả lời đúng</p>
    <p id="msg"></p>
    <button class="go" id="again" type="button">Chơi lại ⭐</button>
    <p id="best2" style="margin:16px 0 0"></p>
  </section>
</main>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var TIME = 5000, KEY = "tinh-nham-noel-best";
  var score = 0, ans = 0, opts = [], locked = true, raf = 0, t0 = 0, playing = false;

  function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t}return a}
  function getBest(){try{return parseInt(localStorage.getItem(KEY),10)||0}catch(e){return 0}}
  function setBest(v){try{localStorage.setItem(KEY,String(v))}catch(e){}}
  function showBest(){var b=getBest(),t=b?"Kỷ lục: "+b+" câu":"";$("best").textContent=t;$("best2").textContent=t}
  function show(id){["start","game","end"].forEach(function(s){$(s).classList.toggle("hidden",s!==id)})}

  function make(){
    var lv = Math.floor(score/5), L = Math.min(lv,5);
    var ops = lv===0 ? ["+","−","×"] : ["+","−","×","÷"];
    var op = ops[rnd(0,ops.length-1)], max = [20,50,99,200,500,999][L], a, b, res;
    if(op==="+"){ a=rnd(2,max); b=rnd(2,max); res=a+b; }
    else if(op==="−"){ a=rnd(5,max); b=rnd(2,a-1); res=a-b; }
    else if(op==="×"){ a=L>=3?rnd(11,[0,0,0,15,19,25][L]):rnd(2,[5,9,12][L]); b=rnd(2,L<2?9:12); res=a*b; }
    else { b=rnd(2,Math.min(12,2+L*2)); res=rnd(2,6+L*3); a=b*res; }
    ans = res;
    var offs = shuffle([1,-1,2,-2,3,-3,10,-10,5,-5]);
    if(op==="×"){ offs = shuffle([a,-a,b,-b]).concat(offs); }
    var set = [res];
    for(var i=0;i<offs.length && set.length<4;i++){
      var v = res+offs[i];
      if(v>=0 && set.indexOf(v)<0) set.push(v);
    }
    var k = 11; while(set.length<4){ if(set.indexOf(res+k)<0) set.push(res+k); k++; }
    opts = shuffle(set);
    $("q").textContent = a+" "+op+" "+b;
    var box = $("opts"); box.innerHTML = "";
    opts.forEach(function(v,i){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.innerHTML = "<small>"+(i+1)+"</small>"+v;
      btn.addEventListener("click", function(){ pick(i); });
      box.appendChild(btn);
    });
  }

  function nextQ(){
    $("fb").textContent = "";
    make();
    locked = false;
    t0 = performance.now();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  function loop(now){
    var left = TIME - (now - t0);
    if(left <= 0){ updateTimer(0); finish(-1); return; }
    updateTimer(left);
    raf = requestAnimationFrame(loop);
  }

  function updateTimer(left){
    $("tm").textContent = (left/1000).toFixed(1);
    var bulbs = $("lights").children;
    for(var i=0;i<bulbs.length;i++){
      var o = Math.max(0, Math.min(1, left/1000 - i));
      bulbs[i].style.opacity = (0.12 + 0.88*o).toFixed(2);
      bulbs[i].style.boxShadow = o > 0.05 ? "0 0 "+(14*o).toFixed(0)+"px 2px var(--c)" : "none";
    }
  }

  function pick(i){
    if(locked || !playing) return;
    locked = true;
    cancelAnimationFrame(raf);
    var btns = $("opts").children;
    if(opts[i] === ans){
      btns[i].classList.add("good");
      score++;
      $("sc").textContent = score;
      $("fb").textContent = score % 5 === 0 ? "Level mới! Phép tính khó hơn rồi 🎁" : "Đúng rồi!";
      setTimeout(nextQ, 350);
    } else {
      btns[i].classList.add("bad");
      finish(i);
    }
  }

  function finish(i){
    locked = true; playing = false;
    cancelAnimationFrame(raf);
    var btns = $("opts").children;
    opts.forEach(function(v,idx){ if(v===ans) btns[idx].classList.add("good"); });
    $("fb").textContent = i < 0 ? "Hết 5 giây rồi!" : "Sai mất rồi!";
    setTimeout(function(){
      var best = getBest(), isNew = score > best;
      if(isNew) setBest(score);
      $("why").textContent = (i < 0 ? "Hết giờ" : "Chọn sai") + ", đáp án đúng là " + ans + ".";
      $("fs").textContent = score;
      $("msg").textContent = score >= 15 ? "Ông già Noel nhờ bạn giữ sổ quà năm nay!"
        : score >= 5 ? "Không tệ chút nào, chú elf nhỏ!"
        : "Tuần lộc còn đang khởi động đấy, thử lại nhé!";
      if(isNew && score > 0) $("msg").textContent = "Kỷ lục mới! " + $("msg").textContent;
      showBest();
      show("end");
      $("again").focus();
    }, 1300);
  }

  function start(){
    score = 0; playing = true;
    $("sc").textContent = 0;
    show("game");
    nextQ();
  }

  $("play").addEventListener("click", start);
  $("again").addEventListener("click", start);
  document.addEventListener("keydown", function(e){
    if(!playing) return;
    var n = parseInt(e.key,10);
    if(n>=1 && n<=4) pick(n-1);
  });
  showBest();

  /* tuyết rơi */
  var cv = $("snow"), cx = cv.getContext("2d"), W = 0, H = 0, fl = [], fc = "#fff", n = 0;
  var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  size(); addEventListener("resize", size);
  for(var i=0;i<70;i++) fl.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.5,v:.3+Math.random()*.9,d:Math.random()*6.28});
  function snow(){
    if(n++ % 60 === 0) fc = getComputedStyle(document.documentElement).getPropertyValue("--flake") || "#fff";
    cx.clearRect(0,0,W,H); cx.fillStyle = fc;
    fl.forEach(function(f){
      if(!still){ f.y += f.v; f.d += .01; f.x += Math.sin(f.d)*.4; if(f.y > H){ f.y = -5; f.x = Math.random()*W; } }
      cx.beginPath(); cx.arc(f.x,f.y,f.r,0,6.283); cx.fill();
    });
    if(!still) requestAnimationFrame(snow);
  }
  snow();
})();
</script>
</body>
</html>
