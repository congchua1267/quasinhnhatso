<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quà Sinh Nhật Số - Gửi Trọn Kỷ Niệm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #fafaf9;
            color: #1c1917;
            line-height: 1.5;
        }

        /* Top Announcement Bar */
        .announcement {
            background-color: #292524;
            color: #f5f5f4;
            text-align: center;
            padding: 8px 16px;
            font-size: 13px;
        }

        .announcement a {
            color: #fde047;
            text-decoration: underline;
            margin-left: 8px;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 5%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #e7e5e4;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: #1c1917;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            background: #166534;
            color: white;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #44403c;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #166534;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #d6d3d1;
            color: #44403c;
        }

        .btn-primary {
            background: #166534;
            color: white;
        }

        .btn-primary:hover {
            background: #14532d;
        }

        /* Filter Tags Bar */
        .filter-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 12px 5%;
            background: #f5f5f4;
            overflow-x: auto;
            border-bottom: 1px solid #e7e5e4;
        }

        .filter-bar span.label {
            font-size: 13px;
            color: #78716c;
            font-weight: 600;
            white-space: nowrap;
        }

        .tag {
            padding: 6px 14px;
            border-radius: 999px;
            background: white;
            border: 1px solid #e7e5e4;
            font-size: 13px;
            color: #44403c;
            white-space: nowrap;
            cursor: pointer;
