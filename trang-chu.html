<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Úm Ba La – Quà kỷ niệm số đa dịp | 20/10</title>
  <meta name="description" content="Gửi yêu thương qua những món quà số ngọt ngào dành cho ngày 20/10.">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap');

    :root {
      --green: #405b4d;
      --green-dark: #2f493b;
      --cream: #faf8f3;
      --cream-dark: #eee9df;
      --pink: #ec79a4;
      --pink-dark: #b64d76;
      --pink-light: #fff0f5;
      --text: #6d5960;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 85px;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background: #fffafa;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* =========================
       THANH MENU PHÍA TRÊN
    ========================= */

    .topbar {
      width: 100%;
      min-height: 70px;
      padding: 10px 7.8%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(250, 248, 243, 0.97);
      border-bottom: 1px solid #e9e4da;
      box-shadow: 0 2px 12px rgba(53, 64, 51, 0.04);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 41px;
      height: 41px;
      border-radius: 50%;
      background: var(--green);
      color: white;
      display: grid;
      place-items: center;
      font-size: 23px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: "Playfair Display", Georgia, serif;
      color: #302f2a;
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
    }

    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      background: #eee9df;
      color: #405b4d;
      padding: 3px 6px;
      border-radius: 4px;
      letter-spacing: 1px;
      font-family: "DM Sans", sans-serif;
    }

    .brand-tag {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1.1px;
      color: #77756a;
      white-space: nowrap;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .nav-music {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #e9e4dc;
      border-radius: 30px;
      padding: 10px 14px;
      background: #fffdfa;
      color: #55534c;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
    }

    .nav-music:hover {
      border-color: #b7c4b8;
      background: #f4f6f0;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 5px;
      border-radius: 30px;
      background: #eeeae2;
    }

    .nav-pill {
      display: inline-block;
      padding: 10px 12px;
      border-radius: 25px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      color: #68665e;
      transition: 0.2s;
    }

    .nav-pill.active,
    .nav-pill:hover {
      background: #fffdfa;
      color: var(--green);
    }

    .nav-create {
      padding: 12px 16px;
      border-radius: 30px;
      background: var(--green);
      color: white;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      transition: 0.25s;
    }

    .nav-create:hover {
      background: var(--green-dark);
      transform: translateY(-1px);
    }

    /* =========================
       BANNER 20/10
    ========================= */

    .hero {
      min-height: 670px;
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      padding: 65px 9%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 77% 40%, rgba(255, 218, 231, 0.93), transparent 43%),
        radial-gradient(ellipse at 30% 95%, rgba(255, 224, 235, 0.9), transparent 48%),
        linear-gradient(135deg, #fffdfd 0%, #fff3f7 50%, #ffe3ed 100%);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        radial-gradient(circle at 12% 22%, rgba(255,255,255,.9) 0 2px, transparent 3px),
        radial-gradient(circle at 72% 20%, rgba(255,255,255,.8) 0 2px, transparent 3px),
        radial-gradient(circle at 88% 76%, rgba(255,255,255,.9) 0 3px, transparent 4px);
      background-size: 90px 90px, 120px 120px, 150px 150px;
      pointer-events: none;
    }

    .hero-inner {
      width: 100%;
      max-width: 1250px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      align-items: center;
      gap: 35px;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 18px;
      border: 1px solid #ffc6d9;
      border-radius: 30px;
      color: #d85d8b;
      background: rgba(255, 255, 255, 0.72);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      margin-bottom: 28px;
    }

    .hero h1 {
      font-family: "Playfair Display", Georgia, serif;
      color: #a7476e;
      font-size: clamp(49px, 5.2vw, 77px);
      line-height: 1.08;
      letter-spacing: -2px;
      margin-bottom: 22px;
      font-weight: 800;
    }

    .hero h1 em {
      color: #ed78a4;
      font-weight: 600;
    }

    .hero-description {
      max-width: 460px;
      color: #a47788;
      font-size: 15px;
      line-height: 2;
      margin-bottom: 28px;
    }

    .hero-buttons {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 15px 23px;
      border-radius: 32px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg, #f18ab0, #d65d8c);
      box-shadow: 0 9px 23px rgba(216, 93, 140, 0.2);
    }

    .hero-note {
      margin-top: 24px;
      color: #c291a2;
      font-size: 12px;
      line-height: 1.8;
    }

    /* =========================
       HỘP QUÀ TRANG TRÍ & CẢNH LÒI RẢ "BÁ KHÍ"
    ========================= */

    .hero-art {
      min-height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .gift-circle {
      width: min(330px, 76vw);
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.77);
      box-shadow: 0 30px 70px rgba(200, 105, 142, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: floatGift 4s ease-in-out infinite;
    }

    .gift-box {
      width: 210px;
      height: 155px;
      position: relative;
      margin-top: 50px;
      filter: drop-shadow(0 17px 13px rgba(170, 65, 108, 0.12));
      cursor: pointer;
      user-select: none;
    }

    .gift-body {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 15px;
      bottom: 0;
      background: linear-gradient(130deg, #f6a1c0, #e97ba6);
      border-radius: 0 0 12px 12px;
      overflow: hidden;
      z-index: 3;
    }

    .gift-ribbon {
      position: absolute;
      z-index: 4;
      width: 45px;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #fff0a9, #ffe7a0);
    }

    .gift-lid-group {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 36px;
      z-index: 10;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-origin: bottom left;
    }

    .gift-lid {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 36px;
      border-radius: 7px;
      background: linear-gradient(100deg, #f99cbd, #e66e9d);
      box-shadow: 0 7px 9px rgba(171, 64, 106, 0.12);
      transform: rotate(-2deg);
    }

    .gift-lid-ribbon {
      position: absolute;
      z-index: 4;
      width: 45px;
      height: 36px;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      background: #ffecaa;
    }

    .gift-heart {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 56px;
      transform: translateX(-50%);
      color: white;
      font-size: 21px;
    }

    .gift-bow {
      position: absolute;
      z-index: 6;
      top: -38px;
      left: 50%;
      color: #f8c75d;
      font-size: 85px;
      font-family: Georgia, serif;
      font-weight: bold;
      line-height: 1;
      transform: translateX(-32%) rotate(-23deg);
      text-shadow: 0 4px 5px rgba(183, 133, 41, 0.1);
    }

    /* HIỆU ỨNG MỞ NẮP HỘP QUÀ */
    .gift-box.open .gift-lid-group {
      transform: translateY(-85px) rotate(-42deg);
    }

    /* HIỆU ỨNG CHÚ NGỰA "BÁ KHÍ" TRỒI LÊN */
    .surprise-card {
      position: absolute;
      left: 50%;
      bottom: 25px;
      width: 140px;
      height: 175px;
      background: white;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.22);
      z-index: 2;
      opacity: 0;
      transform: translateX(-50%) translateY(40px) scale(0.4);
      transition: all 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .surprise-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    /* Khi mở quà, con bá khí bay vọt lên */
    .gift-box.open .surprise-card {
      opacity: 1;
      transform: translateX(-50%) translateY(-115px) scale(1) rotate(-3deg);
      pointer-events: auto;
    }

    .gift-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -43px;
      text-align: center;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 17px;
      font-style: italic;
      color: #bf728f;
      white-space: nowrap;
    }

    /* Các hạt hoa tung tóe */
    .flower-particle {
      position: absolute;
      pointer-events: none;
      z-index: 100;
      font-size: 24px;
      animation: burstOut 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes burstOut {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.3) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(var(--scale)) rotate(var(--rot));
      }
    }

    .decor {
      position: absolute;
      user-select: none;
      pointer-events: none;
      animation: floatDecor 4s ease-in-out infinite;
    }

    .decor-heart {
      font-size: 25px;
      color: #e78aab;
    }

    .decor-flower {
      font-size: 35px;
      color: #e99ab6;
    }

    .flower-left {
      top: 11%;
      left: 3.5%;
      font-size: 78px;
      color: #f8e2eb;
    }

    .flower-right {
      bottom: 8%;
      right: 4%;
      font-size: 90px;
      color: #f8cddd;
    }

    .heart-one {
      top: 27%;
      left: 5%;
    }

    .heart-two {
      top: 23%;
      right: 12%;
      font-size: 20px;
    }

    .heart-three {
      bottom: 26%;
      right: 17%;
    }

    .flower-small {
      bottom: 29%;
      left: 5%;
    }

    @keyframes floatGift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-11px); }
    }

    @keyframes floatDecor {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -10px; }
    }

    /* =========================
       PHẦN GIỚI THIỆU TRẢI NGHIỆM
    ========================= */

    .section {
      padding: 85px 8%;
      scroll-margin-top: 85px;
    }

    .section-heading {
      max-width: 680px;
      margin: 0 auto 42px;
      text-align: center;
    }

    .section-kicker {
      color: #d96b95;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 13px;
    }

    .section-heading h2 {
      font-family: "Playfair Display", Georgia, serif;
      color: #a7476e;
      font-size: clamp(30px, 4vw, 43px);
      margin-bottom: 14px;
    }

    .section-heading p {
      color: #987a85;
      font-size: 14px;
      line-height: 1.9;
    }

    .experience-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .experience-card {
      padding: 30px 25px;
      background: white;
      border: 1px solid #f5e4ea;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(150, 89, 112, 0.055);
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .experience-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 35px rgba(150, 89, 112, 0.1);
    }

    .card-icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 17px;
      background: #fff0f5;
      font-size: 25px;
      margin-bottom: 20px;
    }

    .experience-card h3 {
      color: #a7476e;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 21px;
      margin-bottom: 12px;
    }

    .experience-card p {
      font-size: 13px;
      color: #987d86;
      line-height: 1.9;
      margin-bottom: 20px;
    }

    .card-link {
      display: inline-block;
      color: #c65380;
      font-size: 12px;
      font-weight: 700;
    }

    /* =========================
       DỊP LỄ / ƯU THẾ
    ========================= */

    .occasion-section {
      background: linear-gradient(135deg, #fff5f8, #fffdfb);
    }

    .occasion-panel {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      padding: 38px;
      background: white;
      border: 1px solid #f4e3e9;
      border-radius: 25px;
      box-shadow: 0 10px 35px rgba(150, 89, 112, 0.06);
    }

    .occasion-panel h3 {
      color: #a7476e;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 26px;
      margin-bottom: 10px;
    }

    .occasion-panel p {
      max-width: 580px;
      color: #987d86;
      font-size: 13px;
      line-height: 1.9;
    }

    .occasion-emoji {
      font-size: 65px;
      flex-shrink: 0;
    }

    .advantages {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      max-width: 1050px;
      margin: 0 auto;
    }

    .advantage {
      text-align: center;
      padding: 25px 18px;
      border-radius: 20px;
      background: #fff7fa;
      border: 1px solid #f8e6ec;
    }

    .advantage span {
      display: block;
      font-size: 28px;
      margin-bottom: 13px;
    }

    .advantage h3 {
      color: #a7476e;
      font-size: 15px;
      margin-bottom: 9px;
    }

    .advantage p {
      color: #987d86;
      font-size: 12px;
      line-height: 1.8;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 30px 8%;
      text-align: center;
      background: #f8f4ed;
      color: #84776d;
      font-size: 12px;
      line-height: 2;
    }

    footer strong {
      color: var(--green);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1250px) {
      .topbar {
        padding-left: 4%;
        padding-right: 4%;
        gap: 14px;
      }

      .nav-actions {
        gap: 2px;
      }

      .nav-pill {
        padding: 9px 8px;
      }

      .nav-create {
        padding: 11px 12px;
      }
    }

    @media (max-width: 1000px) {
      .hero {
        padding: 65px 6%;
      }

      .hero-inner {
        gap: 15px;
      }

      .hero h1 {
        font-size: clamp(46px, 6vw, 65px);
      }

      .hero-art {
        min-height: 350px;
      }

      .gift-circle {
        width: 285px;
      }

      .gift-box {
        transform: scale(0.86);
      }
    }

    @media (max-width: 700px) {
      .topbar {
        padding: 12px 5%;
        gap: 10px;
      }

      .brand-name {
        font-size: 21px;
      }

      .brand-tag {
        font-size: 7px;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
      }

      .nav-right {
        gap: 5px;
      }

      .nav-actions {
        display: none;
      }

      .nav-music {
        padding: 9px 11px;
      }

      .hero {
        padding: 50px 7% 65px;
      }

      .hero-inner {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .hero-content {
        text-align: center;
      }

      .hero-label {
        font-size: 9px;
        letter-spacing: 0.6px;
        padding: 9px 13px;
        margin-bottom: 23px;
      }

      .hero h1 {
        font-size: clamp(43px, 11vw, 62px);
        letter-spacing: -1.5px;
      }

      .hero-description {
        margin-left: auto;
        margin-right: auto;
        font-size: 13px;
      }

      .hero-buttons {
        justify-content: center;
      }

      .btn {
        padding: 13px 17px;
        font-size: 12px;
      }

      .hero-note {
        font-size: 11px;
      }

      .hero-art {
        min-height: 335px;
      }

      .gift-circle {
        width: 265px;
      }

      .flower-left {
        font-size: 50px;
      }

      .flower-right {
        font-size: 60px;
      }

      .section {
        padding: 65px
